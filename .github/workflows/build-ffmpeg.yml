name: Build Windows XR FFmpeg LGPL 7.1

on:
  push:
    branches: [ffmpeg-package-build]
    paths:
      - 'packaging/ffmpeg/**'
      - '.github/workflows/build-ffmpeg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install cross-compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            mingw-w64-tools nasm cmake ninja-build pkg-config curl xz-utils patch
      - name: Build pinned LGPL FFmpeg and oneVPL
        run: bash packaging/ffmpeg/build.sh
      - name: Upload binary, complete sources and licenses
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windowsxr-ffmpeg-lgpl71
          path: dist/ffmpeg-lgpl71/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windowsxr-ffmpeg-build-failure
          path: |
            dist/ffmpeg-lgpl71/build-info/
            ffmpeg-build-work/src/ffmpeg-7.1/ffbuild/config.log
          if-no-files-found: warn
          retention-days: 7
